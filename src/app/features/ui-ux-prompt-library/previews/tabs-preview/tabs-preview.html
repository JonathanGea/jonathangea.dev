<div class="tabs-demo"><div class="tabs" role="tablist" aria-label="Workspace tabs" (keydown)="navigate($event)"><span class="tab-indicator" [style.transform]="'translateX(' + active * 100 + '%)'" aria-hidden="true"></span>@for (name of names; track name; let i = $index) {<button role="tab" [id]="id + '-tab-' + i" [attr.aria-controls]="id + '-panel'" [attr.aria-selected]="active === i" [tabIndex]="active === i ? 0 : -1" (click)="active = i">{{name}}</button>}</div><div role="tabpanel" [id]="id + '-panel'" [attr.aria-labelledby]="id + '-tab-' + active" tabindex="0"><h3>{{names[active]}}</h3><p>{{panels[active]}}</p></div></div>
