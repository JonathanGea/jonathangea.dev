<form class="floating-form" novalidate (submit)="submit($event)"><p>Stay in the loop</p><div class="floating-field"><input [id]="id" type="email" autocomplete="email" placeholder=" " required [value]="value" (input)="value = $any($event.target).value; submitted = false" (blur)="touched = true" [attr.aria-invalid]="touched && !valid" [attr.aria-describedby]="id + '-feedback'"><label [for]="id">Email address</label></div><p [id]="id + '-feedback'" class="field-help" aria-live="polite">{{submitted ? 'You’re subscribed. Thank you!' : touched && !valid ? 'Enter a valid email, e.g. name@example.com.' : 'One thoughtful update each month.'}}</p><button class="primary" type="submit">Subscribe ↗</button></form>
