<div class="window commerce"><div class="window-bar"><span></span><span></span><span></span></div><div class="product-grid"><div><div class="product-art" [style.background]="color" role="img" [attr.aria-label]="view + ' view of Everyday Form bag'"><div class="bag" [class.bag-side]="view === 'Side'"><span></span></div></div><div class="row thumbnails">@for (name of ['Front', 'Side']; track name) {<button [attr.aria-pressed]="view === name" (click)="view = name">{{name}}</button>}<button aria-label="Preview cart error" [disabled]="adding" (click)="addToBag(true)">Error</button></div></div><div><small>Essentials / 2026</small><h3>Everyday Form</h3><p>$129.00</p><div class="row swatches" aria-label="Product color">@for (option of colors; track option.name) {<button [style.background]="option.value" [attr.aria-label]="option.name" [attr.aria-pressed]="color === option.value" (click)="color = option.value; colorName = option.name; message = ''"></button>}</div><small>{{colorName}} · In stock</small><button class="primary full" [disabled]="adding" (click)="addToBag()">{{adding ? 'Adding…' : failed ? 'Retry add to bag' : 'Add to bag'}}</button><p class="feedback" [attr.role]="failed ? 'alert' : 'status'">{{message || 'Free delivery · 2–4 days'}}</p></div></div></div>
