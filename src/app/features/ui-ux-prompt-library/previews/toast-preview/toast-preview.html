<div class="toast-demo"><div class="toast-controls"><button class="outline" (click)="show('success')">Success</button><button class="outline" (click)="show('error')">Error</button></div><div class="toast-space"><div [attr.role]="variant === 'error' ? 'alert' : 'status'" aria-atomic="true">@if (visible) {<div class="toast" [class.leaving]="leaving" (mouseenter)="setHovered(true)" (mouseleave)="setHovered(false)" (focusin)="setFocused(true)" (focusout)="focusOut($event)"><span class="toast-icon" [class.error]="variant === 'error'">{{variant === 'success' ? '✓' : '!'}}</span><div><strong>{{variant === 'success' ? 'Changes saved' : 'Could not save'}}</strong><p>{{variant === 'success' ? 'Your workspace is up to date.' : 'Check your connection and try again.'}}</p></div><button aria-label="Dismiss notification" (click)="dismiss()">×</button></div>}</div></div><small>Pauses while hovered or focused.</small></div>
