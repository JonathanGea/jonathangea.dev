<section id="projects" class="py-16 bg-gray-50 scroll-mt-24">
  <div class="container mx-auto px-4 max-w-6xl">
    <h2 class="text-3xl font-bold text-gray-900 mb-3">Proyek Pilihan</h2>
    <p class="text-gray-600 mb-8">Jelajahi proyek dan proses pengembangannya.</p>
    <div class="flex flex-wrap gap-2 mb-8" aria-label="Filter domain proyek">
      <button (click)="selectedDomains = []" [attr.aria-pressed]="selectedDomains.length === 0"
        class="px-4 py-2 rounded-full border" [class.bg-black]="selectedDomains.length === 0" [class.text-white]="selectedDomains.length === 0">Semua</button>
      <button *ngFor="let domain of availableDomains" (click)="toggleDomain(domain)"
        [attr.aria-pressed]="selectedDomains.includes(domain)" [class.bg-black]="selectedDomains.includes(domain)"
        [class.text-white]="selectedDomains.includes(domain)" class="px-4 py-2 rounded-full border">{{ domain }}</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <article *ngFor="let project of filteredProjects" class="bg-white rounded-xl overflow-hidden border border-gray-200 flex flex-col shadow-sm">
        <div class="project-gallery relative aspect-video bg-gray-100 overflow-hidden" role="region"
          aria-roledescription="carousel" [attr.aria-label]="'Foto ' + project.title" tabindex="0"
          (keydown.arrowLeft)="moveSlide(project, -1); $event.preventDefault()"
          (keydown.arrowRight)="moveSlide(project, 1); $event.preventDefault()"
          (pointerdown)="startSwipe($event, project)" (pointerup)="endSwipe($event, project)"
          (pointercancel)="cancelSwipe()" (lostpointercapture)="cancelSwipe()">
          <div class="gallery-track flex h-full" [style.transform]="'translateX(-' + slideIndex(project) * 100 + '%)'">
            <div *ngFor="let image of images(project); let i = index" class="w-full h-full shrink-0"
              [attr.aria-hidden]="i !== slideIndex(project)">
              <img [src]="image" [alt]="project.title + ' — foto ' + (i + 1)" class="w-full h-full object-contain"
                loading="lazy" draggable="false">
            </div>
          </div>
          <ng-container *ngIf="images(project).length > 1">
            <button type="button" (click)="moveSlide(project, -1)" [attr.aria-label]="'Foto sebelumnya: ' + project.title"
              class="gallery-arrow absolute left-3 top-1/2 -translate-y-1/2">‹</button>
            <button type="button" (click)="moveSlide(project, 1)" [attr.aria-label]="'Foto berikutnya: ' + project.title"
              class="gallery-arrow absolute right-3 top-1/2 -translate-y-1/2">›</button>
            <span class="absolute top-3 right-3 rounded-full bg-black/70 text-white px-3 py-1 text-xs" aria-live="polite" aria-atomic="true">
              {{ slideIndex(project) + 1 }} / {{ images(project).length }}
            </span>
            <div class="absolute bottom-2 inset-x-0 flex justify-center">
              <div class="flex rounded-full bg-black/60 px-2">
                <button *ngFor="let image of images(project); let i = index" type="button" (click)="goToSlide(project, i)"
                  [attr.aria-label]="project.title + ': tampilkan foto ' + (i + 1)" [attr.aria-pressed]="i === slideIndex(project)"
                  class="gallery-dot"><span [class.active]="i === slideIndex(project)"></span></button>
              </div>
            </div>
          </ng-container>
        </div>
        <div class="p-6 flex flex-col flex-1">
          <div class="flex items-center justify-between gap-3 text-sm text-gray-500 mb-2"><span>{{ project.domain }}</span><span>{{ project.year }}</span></div>
          <h3 class="text-xl font-bold mb-3"><a [routerLink]="['/projects', project.slug]" class="hover:underline">{{ project.title }}</a></h3>
          <p class="text-gray-600 mb-4 flex-1">{{ project.description }}</p>
          <div class="flex flex-wrap gap-2 mb-6"><span *ngFor="let tag of project.tags" class="text-xs px-3 py-1 rounded-full bg-gray-100">{{ tag }}</span></div>
          <div class="flex flex-wrap gap-3">
            <a [routerLink]="['/projects', project.slug]" class="bg-black text-white rounded-lg px-4 py-2 text-sm">Lihat Detail →</a>
            <a *ngIf="project.livePreviewUrl" [href]="project.livePreviewUrl" target="_blank" rel="noopener noreferrer" class="border rounded-lg px-4 py-2 text-sm">Live Demo ↗</a>
          </div>
        </div>
      </article>
    </div>
    <p *ngIf="!filteredProjects.length" class="text-center py-12 text-gray-600">Tidak ada proyek untuk filter ini.</p>
  </div>
</section>
